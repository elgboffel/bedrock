name: Teardown Dev

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch: # Manual "Run workflow" button

jobs:
  teardown:
    name: remove dev stage
    # Serialize teardowns so concurrent manual + nightly can't collide.
    concurrency:
      group: teardown-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache SST providers
        uses: actions/cache@v4
        with:
          path: .sst/platform
          key: sst-platform-${{ hashFiles('package.json') }}
          restore-keys: sst-platform-
      - name: Install SST providers
        run: pnpm sst install
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Clear any stale SST state lock
        run: pnpm sst unlock --stage dev
        continue-on-error: true
      - run: pnpm sst remove --stage dev
