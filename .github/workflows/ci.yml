name: CI

on:
  pull_request:
    # Only run on PRs targeting these branches (forks still run CI via
    # pull_request which has read-only GITHUB_TOKEN — safe but saves minutes
    # on unrelated PRs).
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Nightly teardown of the dev stage (see nightly-teardown-dev), so a
  # dev environment can never leak overnight.
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  # Manual "Run workflow" button — handy to force-remove the dev stage on demand.
  workflow_dispatch:

# NOTE: concurrency is set PER JOB below, not workflow-wide. Test jobs cancel
# superseded runs (save minutes); deploy/remove jobs must NEVER be cancelled
# mid-flight — killing `sst deploy` halfway orphans resources and locks state.
# They use cancel-in-progress: false so a new push QUEUES behind them instead.

# Opt JS actions into Node.js 24 now (some actions still bundle Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: lint · typecheck · build · unit tests
    # Skip the test suite on schedule/manual runs — those only manage the dev stage.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-ci-${{ github.ref }}
      cancel-in-progress: true # cheap tests: cancel superseded runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test # unit only — integration runs in the integration job

  integration:
    name: integration tests (Docker)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-integration-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest # ships Docker; testcontainers pulls postgres:16
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  deploy:
    name: deploy (sst, production)
    needs: [ci, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # NEVER cancel a deploy mid-flight — serialize prod deploys instead.
    concurrency:
      group: ${{ github.workflow }}-deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production # required-reviewer gate (configure in repo settings)
    permissions:
      id-token: write # OIDC: mint token to assume the AWS deploy role
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Defensive: clear a stale lock from a previous hard failure (runner
      # crash, GitHub infra issue). Safe because concurrency serializes deploys.
      - name: Clear any stale SST state lock
        run: pnpm sst unlock --stage production
        continue-on-error: true
      - run: pnpm sst deploy --stage production

  # --- Dev stage: auto-deploy on push to `dev`, no approval gate ------------
  deploy-dev:
    name: deploy (sst, dev)
    needs: [ci, integration]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    # NEVER cancel a deploy mid-flight (orphans + state lock). A new push to dev
    # queues behind the running deploy instead of killing it.
    concurrency:
      group: ${{ github.workflow }}-deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Defensive: a previous run cancelled mid-deploy (cancel-in-progress) can
      # leave the SST state locked. Concurrency guarantees only one dev deploy
      # runs at a time, so clearing a stale lock here is safe. dev only.
      - name: Clear any stale SST state lock
        run: pnpm sst unlock --stage dev
        continue-on-error: true
      - name: Deploy dev
        id: deploy-dev
        run: |
          OUTPUT=$(pnpm sst deploy --stage dev 2>&1)
          echo "$OUTPUT"
          # Extract the web URL from SST output for smoke test
          URL=$(echo "$OUTPUT" | grep -oP 'web:\s*\K(https?://\S+)' || true)
          echo "web_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.deploy-dev.outputs.web_url != ''
        run: |
          URL="${{ steps.deploy-dev.outputs.web_url }}"
          echo "Smoke-testing $URL/health ..."
          # Give ECS tasks time to pass health checks and register
          sleep 30
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors "${URL}/health"

  # --- Nightly + manual teardown: guarantee dev is cleaned up ---------------
  # Runs on the cron schedule (02:00 UTC) and on the manual "Run workflow"
  # button. Dev stays up until then — no wasted runner minutes on sleep timers.
  nightly-teardown-dev:
    name: nightly dev teardown (backstop)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Serialize teardowns so concurrent manual + nightly can't collide.
    concurrency:
      group: ${{ github.workflow }}-teardown-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Clear any stale SST state lock
        run: pnpm sst unlock --stage dev
        continue-on-error: true
      - run: pnpm sst remove --stage dev
