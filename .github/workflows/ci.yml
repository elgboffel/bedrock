name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # Nightly backstop teardown of the dev stage (see nightly-teardown-dev), so a
  # dev environment can never leak even if a timed teardown was cancelled.
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  # Manual "Run workflow" button — handy to force-remove the dev stage on demand.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt JS actions into Node.js 24 now (some actions still bundle Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: lint · typecheck · build · unit tests
    # Skip the test suite on schedule/manual runs — those only manage the dev stage.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test # unit only — integration runs in the integration job

  integration:
    name: integration tests (Docker)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest # ships Docker; testcontainers pulls postgres:16
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  deploy:
    name: deploy (sst, production)
    needs: [ci, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # required-reviewer gate (configure in repo settings)
    permissions:
      id-token: write # OIDC: mint token to assume the AWS deploy role
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm sst deploy --stage production

  # --- Dev stage: auto-deploy on push to `dev`, no approval gate ------------
  deploy-dev:
    name: deploy (sst, dev)
    needs: [ci, integration]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm sst deploy --stage dev

  # --- Timed teardown: keep the dev stage up for a window, then remove ------
  # Window is a plain `sleep` — the runner stays alive for it. Start at 1h to
  # verify the loop works; tune freely. AWS creds are fetched AFTER the sleep so
  # the OIDC token can't expire mid-wait.
  teardown-dev:
    name: teardown dev (timed)
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep dev up for the window
        run: sleep 3600 # 1h — change to taste
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm sst remove --stage dev

  # --- Nightly backstop: guarantee dev is gone overnight --------------------
  # Runs on the cron schedule and on the manual button. Removes dev even if a
  # timed teardown above was cancelled (e.g. by a re-push) and left it running.
  nightly-teardown-dev:
    name: nightly dev teardown (backstop)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm sst remove --stage dev
