services:
  postgres:
    image: postgres:16-alpine
    container_name: bedrock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bedrock-api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      SERVER_PORT: 3001
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      INTERNAL_AUTH_PREVIOUS_TOKEN: ${INTERNAL_AUTH_PREVIOUS_TOKEN:-}
      OTEL_SERVICE_NAME: bedrock-api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bedrock-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SERVER_PORT: 3000
      API_URL: http://api:3001
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      OTEL_SERVICE_NAME: bedrock-web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
